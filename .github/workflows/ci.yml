name: CI
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      CAERUS_ALLOW_LIVE: '0'
      LANGFUSE_PUBLIC_KEY: ''
      LANGFUSE_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen caerus demo --output-dir outputs/ci-demo
      - run: uv build --python ${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: outputs/ci-demo
