  - systems

education:
  - institution: Example University
    location: "City, ST"
    degree: "Master's in Computer Science"
    dates: "2025 - 2027 (Expected)"

voice_profile:
  tone: "clear, direct, grounded"
  forbidden_phrases:
    - "deeply passionate about"
  personal_hooks: []

resume_variants:
  AI_ML:
    description: "AI/ML focused profile"
    file: your_name_resume_ml.pdf
  SYSTEMS:
    description: "Low-level systems profile"
