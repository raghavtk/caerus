[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caerus"
version = "0.1.0"
description = "Caerus job application agent"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "loguru>=0.7.2",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
  "beautifulsoup4>=4.12.3",
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0",
  "tenacity>=8.3.0",
  # Async research requires the SDK async context manager for cleanup.
  "google-genai>=1.40.0",
  "instructor>=1.4.0",
  "langfuse>=2.37.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
caerus = "cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "live: hits Gemini/search APIs; requires CAERUS_ALLOW_LIVE=1 (deselected otherwise)",
]

[tool.setuptools]
packages = ["agents", "skills", "skills.ats_scrapers", "skills.demo_data", "schemas"]
py-modules = ["cli", "config", "llm"]

[tool.setuptools.package-data]
skills = ["demo_data/*.json", "demo_data/*.txt"]
